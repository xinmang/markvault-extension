name: 构建与发布扩展

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: 检查与打包
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: 读取版本
        id: version
        run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: 生产依赖安全检查
        run: pnpm audit --prod --audit-level high --registry=https://registry.npmjs.org
      - name: 回归测试
        run: pnpm test
      - name: 构建并校验版本
        run: pnpm build
      - name: 保存安装包与校验和
        uses: actions/upload-artifact@v4
        with:
          name: markvault-extension
          path: |
            release/markvault-extension-chrome.zip
            release/checksums.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    name: 发布 GitHub Release
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: markvault-extension-release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: markvault-extension
      - name: 校验安装包
        run: sha256sum --check checksums.sha256
      - name: 创建标签并发布
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"

          if [ "$REF_TYPE" = "tag" ] && [ "$REF_NAME" != "$TAG" ]; then
            echo "标签 ${REF_NAME} 与版本 ${VERSION} 不一致" >&2
            exit 1
          fi

          TAG_EXISTS=false
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            TAG_EXISTS=true
            git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}" >/dev/null 2>&1
            TAG_COMMIT=$(git rev-list -n 1 "refs/tags/${TAG}")
            if [ "$TAG_COMMIT" != "$COMMIT_SHA" ]; then
              echo "标签 ${TAG} 已指向 ${TAG_COMMIT}，与当前提交 ${COMMIT_SHA} 不一致；请递增版本。" >&2
              exit 1
            fi
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} 已存在，更新安装包。"
            gh release upload "$TAG" markvault-extension-chrome.zip checksums.sha256 --clobber
            exit 0
          fi

          if [ "$TAG_EXISTS" = true ]; then
            gh release create "$TAG" \
              markvault-extension-chrome.zip checksums.sha256 \
              --verify-tag --generate-notes --title "MarkVault Extension ${TAG}"
          else
            gh release create "$TAG" \
              markvault-extension-chrome.zip checksums.sha256 \
              --target "$COMMIT_SHA" --generate-notes --title "MarkVault Extension ${TAG}"
          fi
