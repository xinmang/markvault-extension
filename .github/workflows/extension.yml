name: 构建与发布扩展

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: 检查与打包
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: 生产依赖安全检查
        run: pnpm audit --prod --audit-level high --registry=https://registry.npmjs.org
      - name: 回归测试
        run: pnpm test
      - name: 构建并校验版本
        run: pnpm build
      - name: 保存安装包与校验和
        uses: actions/upload-artifact@v4
        with:
          name: markvault-extension
          path: |
            release/markvault-extension-chrome.zip
            release/checksums.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    name: 发布 GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: markvault-extension
      - name: 发布安装包
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          sha256sum --check checksums.sha256
          gh release create "$RELEASE_TAG" \
            markvault-extension-chrome.zip checksums.sha256 \
            --verify-tag --generate-notes --title "MarkVault Extension $RELEASE_TAG"
